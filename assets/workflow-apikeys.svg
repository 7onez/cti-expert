th="424.964" x="1328.1017" y="2727.0071">Check:       /apikeys status | test | unlocks</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="97.1027" x="1328.1017" y="2756.8007">Balances:</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="111.8027" x="1447.9543" y="2756.8007">/cti-status</text><line style="stroke:#000000;stroke-width:1.5625;" x1="1320.2892" x2="1891.2309" y1="2771.0225" y2="2771.0225"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="256.0459" x="1328.1017" y="2802.2193">Keyless correlation tools:</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="440.6483" x="1328.1017" y="2832.0129">/rank-relations &#183; /cert-pivot &#183; /pivot-suggest</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="510.6699" x="1328.1017" y="2861.8065">/crypto-balance &#183; /email-hygiene &#183; /sensitive-paths</text><line style="stroke:#000000;stroke-width:1.5625;" x1="1320.2892" x2="1891.2309" y1="2876.0284" y2="2876.0284"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="499.645" x="1328.1017" y="2907.2252">No keys set  -&gt;  everything runs keyless / free.</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="418.8391" x="1328.1017" y="2937.0188">A missing or bad key degrades to a note,</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="239.5741" x="1328.1017" y="2966.8124">it never breaks the run.</text><line style="stroke:#000000;stroke-width:1.5625;" x1="1320.2892" x2="1891.2309" y1="2981.0343" y2="2981.0343"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="54.0748" x="1328.1017" y="3012.231">Cost:</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="224.7648" x="1387.864" y="3012.231">third-party credits are</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="37.4061" x="1618.3163" y="3012.231">not</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="58.6029" x="1661.4099" y="3012.231">in the</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="455.1296" x="1328.1017" y="3042.0246">model's total_cost_usd. Two ledgers, always.</text></g><?plantuml-src RLZjSkB85VtlfxYrILM0iP3dixAUoQImWJ5PWnrWPdPIhg8QgK6zIDtQxXQOpMOh3v5toVyyIfuavxO4PcSpFuoa_heVvvvxUhpokQJ4gqW-bj9wshxeFdz1__tdloZUoMMfjiRJCqgCjJ8NNXcDjzBAGbK5zUv7qKRkQMViPfMRtPdRA5qAAmfocKZDJkarhKJkvCb8MYfw_lhYz8jSYIhtGwFzH1IIlfd9jP7qSVJDoQIUjMPtRN9ZwNSlNxtwzlNWP530WQtoU_hx6T6LI3PhQogTDjC7lU6BuHMF69jAstnzSVrcUCLV-qeKHgU_MJOS3b_stvnCE5rz_STlBvuFCJZpmlgljnmSDsa-_UFipF74iyjEvock7wUtdGxHV_vDXC-SXEFtdqVtfqF2IUhVZNkZIQVpbZS94nVoqLlutYttdSw3NacVP5IAjQGMpdPYArDUHJ5z5lib_AD4bBwoieqaDci9LgaL7Xms45kL8CD5aRt4Z29zpGPyw6633tFUffVEf8OfCNtiyT1MMhLIIOqBRpOOVD0xaUVIEnwNXL1vU2epesLucijShZbflBKnQy2lRn8QzTa0Oxoq9DBKIXTc3-PYpR_inZFoiYY1Gaah84lQqYhjGpYajYh95hdQobQRGtIs0YQH2OnzD_XoEvZDQ8aWvahB0ExUxUVUbndPIZiENM9zrsNKIYH7WpsIXF1e1tn9dUpR3_e6yPDsBknQUWJPEPn5_ScChHFQw7rXAaULpLqYz8EUzdltFAJANMQwAZWpoqmgD8qqdDJIzwyUD0S8uPpT3_6tF-vDhtdYzTqqxFkNtdJyDhX2OYsKXaDgHQsJ-YEkFxmxgVsV7pGUJ0wx0bGlQJ3vH5jXANfFLfQ6kb9l-UMNk8iyhzGwVghyDlbCQchnXaxwDiuAuRkV3iQZZsEgGoojOrp6SSleVCzBs097UrDn5LR8VRqyZiC64Vw5Xqvdf5TME6-hX27OwOJFJKXQNq6Fyq2pcrxqulMRTeW8e8LZdkO1c_Mqsj3XtJ0WijFvQoKsA82NRou0XFhJtumf1djPlyvaKbbmnTmUiDdaBBgVtl7hw5u1Y8tH4-bpmIwtcbJpJFxzV7Ct2X-2gKgdyh5Td_P9v2fLcjUKpQ8m1xy7w_6uDEcUCW7GCHnNLeP0jhyEsjrE8-IPAfjuVSwCSj-FRpa3jGdFwczqevmtTayIGSR7gKHnebJhINn6Vyera0kTo4DsiF9n7