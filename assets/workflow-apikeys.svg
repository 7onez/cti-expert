341.7399" x="621.3598" y="1287.1981">entitlement measured, not assumed</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="621.7546" x="621.3598" y="1312.7357">free account probes -&gt; cases/&lt;id&gt;/capability_plans.json (once per case)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="139.4635" x="621.3598" y="1338.2734">a key measured</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="32.1377" x="765.6983" y="1338.2734">free</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="292.9896" x="802.7111" y="1338.2734">skips the Pro calls that would 403</text><rect fill="#EAF2FB" height="107.863" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="730.5174" x="566.9784" y="1390.6422"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="187.8388" x="582.6034" y="1426.3111">api_usage.record(...)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="479.666" x="582.6034" y="1451.8488">every metered call logged to MEMORY/api_usage.jsonl</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="699.2674" x="582.6034" y="1477.3864">per-case legs (IntelX &#183; reverse-WHOIS &#183; MO-neighbour origins) bought ONCE per case</text><rect fill="#EAF2FB" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="501.6346" x="1392.7213" y="610.0633"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="121.5759" x="1408.3463" y="645.7322">skip premium</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="470.3846" x="1408.3463" y="671.2698">keyless leads only &#8212; identical coverage, lower tier</text><polygon fill="#FFF3D6" points="1287.8879,1507.8802,1306.6379,1526.6302,1287.8879,1545.3802,1269.1379,1526.6302,1287.8879,1507.8802" style="stroke:#C8901F;stroke-width:0.7813;"/><rect fill="#555555" height="9.375" rx="3.9063" ry="3.9063" style="stroke:#555555;stroke-width:1.5625;" width="1895.9184" x="17.1875" y="1576.6302"/><rect fill="#EAF2FB" height="56.7877" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="510.1659" x="696.0013" y="1617.2552"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="254.7018" x="711.6263" y="1652.9241">ranked pivots + live_results</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="209.589" x="980.9531" y="1652.9241">(high -&gt; low confidence)</text><rect fill="#EAF2FB" height="184.4761" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="841.6307" x="530.2689" y="1705.2929"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="210.564" x="545.8939" y="1740.9618">correlate &#8212; all keyless</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="634.2235" x="545.8939" y="1766.4995">rank_relations.py  score same-operator siblings, drop shared-infra noise</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="510.6599" x="545.8939" y="1792.0372">cert_pivot.py / cert_overlap  cert fingerprint + SAN siblings</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="322.8773" x="545.8939" y="1817.5748">pivot_suggest.py  ranked next-pivots</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" t