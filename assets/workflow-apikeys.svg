 UI'" font-size="18.75" lengthAdjust="spacing" textLength="420.1905" x="51.5625" y="1077.2126">HackerTarget passive DNS &#183; anonymous urlscan</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="320.6835" x="51.5625" y="1102.7503">RDAP &#183; ipwho.is &#183; Shodan InternetDB</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="292.5021" x="51.5625" y="1128.288">mail / SPF / DMARC &#183; CORS &#183; JARM</text><polygon fill="#FFF3D6" points="1063.6871,547.6199,1512.0886,547.6199,1530.8386,571.0291,1512.0886,594.4383,1063.6871,594.4383,1044.9371,571.0291,1063.6871,547.6199" style="stroke:#C8901F;stroke-width:0.7813;"/><text fill="#000000" font-family="'Segoe UI'" font-size="17.1875" lengthAdjust="spacing" textLength="212.3844" x="1063.6871" y="565.9932">premium API key present?</text><text fill="#000000" font-family="'Segoe UI'" font-size="17.1875" lengthAdjust="spacing" textLength="448.4015" x="1063.6871" y="589.4024">resolve order: ENV var -&gt; repo .env -&gt; /.config/cti-expert</text><text fill="#000000" font-family="'Segoe UI'" font-size="17.1875" lengthAdjust="spacing" textLength="56.2371" x="988.7" y="565.9932">key set</text><text fill="#000000" font-family="'Segoe UI'" font-size="17.1875" lengthAdjust="spacing" textLength="53.1262" x="1530.8386" y="565.9932">no key</text><rect fill="#EAF2FB" height="610.2159" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="858.4683" x="503.003" y="610.0633"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="184.8576" x="518.628" y="645.7322">PREMIUM enrichers</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="9.7501" x="703.4856" y="645.7322">&#160;&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="251.3455" x="713.2356" y="645.7322">(only the keys you actually set)</text><line style="stroke:#2C6FBB;stroke-width:1.5625;" x1="503.003" x2="1361.4713" y1="659.0384" y2="659.0384"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="134.6822" x="518.628" y="686.8948">Infrastructure</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="597.2481" x="518.628" y="712.4325">Shodan (favicon mmh3 + cert SHA-256) &#183; Censys (favicon md5 + cert)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="55.9879" x="518.628" y="737.9702">FOFA &#183;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="111.0382" x="579.4909" y="737.9702">Quake (360)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="5.025" x="695.4042" y="737.9702">&#183;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="84.7319" x="705.3043" y="737.9702">ZoomEye</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="317.0273" x="794.9112" y="737.9702">&#183; SecurityTrails &#183; urlscan-PRO &#183; IPinfo</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="60.8254" x="518.628" y="763.5079">Netlas</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="293.8333" x="584.3284" y="763.5079">(DNS &#183; scan &#183; WHOIS &#183; cert index) &#183;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="64.8566" x="883.0368" y="763.5079">Validin</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="393.0778" x="952.7685" y="763.5079">(pDNS &#183; cert &#183; favicon &#183; body hash &#8212; free key)</text><line style="stroke:#2C6FBB;stroke-width:1.5625;" x1="503.003" x2="1361.4713" y1="776.8142" y2="776.8142"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="102.1132" x="518.628" y="804.6706">Ownership</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="92.0069" x="518.628" y="830.2082">WhoisXML</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="521.0099" x="615.5099" y="830.2082">(WHOIS + Whois History eras + Reverse WHOIS &#8212; DRS balance)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="461.7033" x="518.628" y="855.7459">Whoxy &#183; DNSLytics (GA / AdSense -&gt; sibling domains)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="145.576" x="518.628" y="881.2836">MO-neighbours</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="622.0356" x="673.9541" y="881.2836">origin IP -&gt; co-tenant apexes (Netlas &#183; Validin &#183; urlscan), WHOIS-verified</text><line style="stroke:#2C6FBB;stroke-width:1.5625;" x1="503.003" x2="1361.4713" y1="894.5899" y2="894.5899"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="323.3461" x="518.628" y="922.4463">Leak / breach / darknet / exposure</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="57.0566" x="518.628" y="947.9839">IntelX</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="458.7972" x="580.5597" y="947.9839">(phonebook &#183; paste &#183; stealer logs &#183; darknet selectors)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="121.8946" x="518.628" y="973.5216">Hudson Rock</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="172.3137" x="645.3976" y="973.5216">&#183; LeakCheck &#183; HIBP &#183;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="154.0323" x="822.5864" y="973.5216">GrayHatWarfare</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="4.875" x="976.6187" y="973.5216">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="340.9898" x="981.4938" y="973.5216">(open buckets &#8212; exposure, never a pivot)</text><line style="stroke:#2C6FBB;stroke-width:1.5625;" x1="503.003" x2="1361.4713" y1="986.8279" y2="986.8279"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="110.8133" x="518.628" y="1014.6843">Search &#183; ads</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="72.3193" x="518.628" y="1040.222">SerpApi</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="423.9031" x="595.8223" y="1040.222">(Ads Transparency &#8212; who paid &#183; cloaking probe)</text><line style="stroke:#2C6FBB;stroke-width:1.5625;" x1="503.003" x2="1361.4713" y1="1053.5283" y2="1053.5283"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="200.3451" x="518.628" y="1081.3847">File half of the funnel</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" tex