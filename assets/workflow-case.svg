y="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="408.18" x="1513.9528" y="1864.8704">Screen every indicator *before* clustering.</text><rect fill="#EAF2FB" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="456.0905" x="1017.2372" y="1788.1608"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="203.1952" x="1032.8622" y="1823.8297">/cti-check INDICATOR</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="206.9265" x="1245.8075" y="1823.8297">&#8212; false-positive control</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="424.8405" x="1032.8622" y="1849.3673">BENIGN (shared noise) vs SIGNAL (operator link)</text><rect fill="#EAF2FB" height="56.7877" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="366.1836" x="1062.1907" y="1909.8844"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="89.6444" x="1077.8157" y="1945.5533">kb_ingest</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="235.5392" x="1177.2101" y="1945.5533">-&gt;  shared knowledge base</text><rect fill="#EAF2FB" height="133.4007" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="670.892" x="909.8365" y="1997.9221"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="102.0007" x="925.4615" y="2033.591">/cti-cluster</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="240.7705" x="1037.2123" y="2033.591">&#8212; peers &#183; shared indicators</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="294.1521" x="925.4615" y="2059.1287">TLS/SAN overlap &#183; reverse-WHOIS</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="145.576" x="925.4615" y="2084.6664">MO-neighbours</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="341.9275" x="1075.9125" y="2084.6664">&#8212; origin-IP co-tenants, WHOIS-verified</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="639.642" x="925.4615" y="2110.204">only a registrant join-key ever seeds; same-MO personas stay a rung-10 table</text><rect fill="#EAF2FB" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="481.7781" x="1004.3934" y="2269.3605"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="450.5281" x="1020.0184" y="2305.0294">confidence gate  &#8212;  exact-match links auto-pursue,</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="175.1638" x="1020.0184" y="2330.5671">weak / PII links held</text><path d="M1481.4963,2377.4954 L1481.4963,2434.3892 L1450.2463,2440.6392 L1481.4963,2446.8892 L1481.4963,2503.783 A0,0 0 0 0 1481.4963,2503.783 L2024.4779,2503.783 A0,0 0 0 0 2024.4779,2503.783 L2024.4779,2393.1204 L2008.8529,2377.4954 L1481.4963,2377.4954 A0,0 0 0 0 1481.4963,2377.4954" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><path d="M2008.8529,2377.4954 L2008.8529,2393.1204 L2024.4779,2393.1204 L2008.8529,2377.4954" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" font-weight="bold" lengthAdjust="spacing" textLength="173.611" x="1490.8713" y="2407.022">autonomy = auto</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="85.0892" x="1669.7636" y="2407.022">(default).</text><text f