nt-weight="bold" lengthAdjust="spacing" textLength="44.1594" x="1692.363" y="1839.3049">split</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="138.1251" x="1741.8036" y="1839.3049">loses the case.</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="408.18" x="1624.0114" y="1866.9705">Screen every indicator *before* clustering.</text><rect fill="#EAF2FB" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="456.0905" x="1127.2959" y="1790.261"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="203.1952" x="1142.9209" y="1825.9298">/cti-check INDICATOR</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="206.9265" x="1355.8661" y="1825.9298">&#8212; false-positive control</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="424.8405" x="1142.9209" y="1851.4675">BENIGN (shared noise) vs SIGNAL (operator link)</text><rect fill="#EAF2FB" height="56.7877" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="366.1836" x="1172.2493" y="1911.9846"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="89.6444" x="1187.8743" y="1947.6535">kb_ingest</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="235.5392" x="1287.2688" y="1947.6535">-&gt;  shared knowledge base</text><rect fill="#EAF2FB" height="133.4007" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="670.892" x="1019.8952" y="2000.0223"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="102.0007" x="1035.5202" y="2035.6912">/cti-cluster</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="240.7705" x="1147.271" y="2035.6912">&#8212; peers &#183; shared indicators</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="294.1521" x="1035.5202" y="2061.2289">TLS/SAN overlap &#183; reverse-WHOIS</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="145.576" x="1035.5202" y="2086.7665">MO-neighbours</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="341.9275" x="1185.9712" y="2086.7665">&#8212; origin-IP co-tenants, WHOIS-verified</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="639.642" x="1035.5202" y="2112.3042">only a registrant join-key ever seeds; same-MO personas stay a rung-10 table</text><rect fill="#EAF2FB" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="481.7781" x="1114.4521" y="2271.4607"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="450.5281" x="1130.0771" y="2307.1296">confidence gate  &#8212;  exact-match links auto-pursue,</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="175.1638" x="1130.0771" y="2332.6673">weak / PII links held</text><path d="M1591.555,2379.5956 L1591.555,2436.4894 L1560.305,2442.7394 L1591.555,2448.9894 L1591.555,2505.8832 A0,0 0 0 0 1591.555,2505.8832 L2134.5366,2505.8832 A0,0 0 0 0 2134.5366,2505.8832 L2134.5366,2395.2206 L2118.9116,2379.5956 L1591.555,2379.5956 A0,0 0 0 0 1591.555,2379.5956" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><path d="M2118.9116,2379.5956 L2118.9116,2395.2206 L2134.5366,2395.2206 L2118.9116,2379.5956" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" font-weight="bold" lengthAdjust="spacing" textLength="173.611" x="1600.93" y="2409.1222">autonomy = auto</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="85.0892" x="1779.8223" y="2409.1222">(default).</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="80.7016" x="1600.93" y="2436.7878">Expands</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" font-weight="bold" lengthAdjust="spacing" textLength="369.5049" x="1686.9129" y="2436.7878">to closure with no approval prompts</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="20.3125" x="2061.6991" y="2436.7878">&#8212;</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="462.2519" x="1600.93" y="2464.4535">the confidence gate, not a human, keeps it tight.</text><text fill="#000000" font-family="'Segoe UI'" font-size="20.3125" lengthAdjust="spacing" textLength="510.1691" x="1600.93" y="2492.1191">Narrow with --checkpoint &#183; --depth N &#183; --reach focused</text><rect fill="#EAF2FB" height="56.7877" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="409.9277" x="1150.3773" y="2414.3456"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="378.6777" x="1166.0023" y="2450.0144">dedup + depth cap  &#183;  per-depth checkpoint</text><rect fill="#EAF2FB" height="56.7877" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="491.3596" x="1109.6613" y="2183.423"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="106.0133" x="1125.2863" y="2219.0919">spider-map</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="344.3463" x="1241.0497" y="2219.0919">&#