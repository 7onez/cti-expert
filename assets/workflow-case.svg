" lengthAdjust="spacing" textLength="14.8314" x="1128.2347" y="3020.776">&#8230;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="119.5321" x="1147.9411" y="3020.776">almost certain</text><rect fill="none" height="674.4623" style="stroke:#000000;stroke-width:2.3438;" width="829.7364" x="830.4143" y="3076.2698"/><path d="M1121.9257,3076.2698 L1121.9257,3095.1259 L1106.3007,3110.7509 L830.4143,3110.7509" fill="none" style="stroke:#000000;stroke-width:2.3438;"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="90.2121" x="835.1018" y="3101.2165">DELIVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="174.2993" x="936.6889" y="3101.2165">(package output)</text><rect fill="#EAF2FB" height="133.4007" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="798.4864" x="846.0393" y="3137.3134"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="174.7888" x="861.6643" y="3172.9823">/cti-report CASE-ID</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="555.3229" x="861.6643" y="3198.5199">--graph  -&gt;  IntelGraph relationship render (PNG/SVG/Mermaid)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="121.2384" x="861.6643" y="3224.0576">house report</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="448.6908" x="992.6527" y="3224.0576">-&gt;  editorial PDF/DOCX composed from the case dir</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="767.2364" x="861.6643" y="3249.5953">charts &#183; landing-page captures (web-scan / web-archive stand