goe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="220.6891" x="1331.2472" y="201.9377">/cti-case CASE-ID seed&#8230;</text><rect fill="#EAF2FB" height="107.863" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="347.996" x="1181.3432" y="254.3065"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="189.6389" x="1196.9682" y="289.9754">route by target type</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="316.746" x="1196.9682" y="315.513">domain &#183; URL &#183; IP &#183; email &#183; username</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="303.3396" x="1196.9682" y="341.0507">phone &#183; wallet &#183; hash &#183; APK / binary</text><rect fill="none" height="195.1437" style="stroke:#000000;stroke-width:2.3438;" width="938.3635" x="1130.4971" y="377.7945"/><path d="M1620.9608,377.7945 L1620.9608,396.6506 L1605.3358,412.2756 L1130.4971,412.2756" fill="none" style="stroke:#000000;stroke-width:2.3438;"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="182.5899" x="1135.1846" y="402.7413">STEP 0 &#8212; RECALL</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="280.8739" x="1329.1494" y="402.7413">(cheapest call in the toolkit)</text><path d="M1595.8102,427.9006 L1595.8102,484.7944 L1564.5602,491.0444 L1595.8102,497.2944 L1595.8102,554.1882 A0,0 0 0 0 1595.8102,554.1882 L2053.2356,554.1882 A0,0 0 0 0 2053.2356,554.1882 L2053.2356,443.5256 L2037.6106,427.9006 L1595.8102,427.9006 A0,0 0 0 0 1595.8102,427.9006" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><path d="M2037.6106,427.9006 L2037.6106,443.5256 L2053.2356,443.5256 L2037.6106,427.9006" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><