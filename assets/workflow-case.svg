" y="2997.3385">&#8212; likelihood band + evidence confidence</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="146.6448" x="1086.7736" y="3022.8761">almost no chance</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="14.8314" x="1238.2934" y="3022.8761">&#8230;</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-style="italic" lengthAdjust="spacing" textLength="119.5321" x="1257.9998" y="3022.8761">almost certain</text><rect fill="none" height="700" style="stroke:#000000;stroke-width:2.3438;" width="885.6683" x="912.507" y="3078.3699"/><path d="M1204.0184,3078.3699 L1204.0184,3097.2261 L1188.3934,3112.8511 L912.507,3112.8511" fill="none" style="stroke:#000000;stroke-width:2.3438;"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" font-weight="bold" lengthAdjust="spacing" textLength="90.2121" x="917.1945" y="3103.3167">DELIVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.875" lengthAdjust="spacing" textLength="174.2993" x="1018.7816" y="3103.3167">(package output)</text><rect fill="#EAF2FB" height="133.4007" rx="19.5313" ry="19.5313" style="stroke:#2C6FBB;stroke-width:0.7813;" width="798.4864" x="956.0979" y="3139.4136"/><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="174.7888" x="971.7229" y="3175.0824">/cti-report CASE-ID</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="555.3229" x="971.7229" y="3200.6201">--graph  -&gt;  IntelGraph relationship render (PNG/SVG/Mermaid)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" font-weight="bold" lengthAdjust="spacing" textLength="121.2384" x="971.7229" y="3226.1578">house report</text><text fill="#000000" font-family="'Segoe UI'" font-size="18.75" lengthAdjust="spacing" textLength="448.6908" x